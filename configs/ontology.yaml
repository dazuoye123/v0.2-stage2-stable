version: "2.0"
key_style: "English snake_case with unit suffix when a standard unit is fixed"
rules:
  - "Core statistical fields must use canonical_key exactly as listed here."
  - "Models may not invent new core parameter names."
  - "Long-tail fields may enter extended_data only when they are not listed as core statistical fields."
  - "All numeric values should be normalized to standard_unit and stored as numbers, with raw text preserved in provenance."

categories:
  precursor_solution: "前驱体/溶胶/纺丝原液"
  composition: "组成与配比"
  forming: "成型与纺丝工艺"
  heat_treatment: "热处理与陶瓷化"
  structure: "物相、微结构与孔结构"
  mechanical: "力学性能"
  thermal: "热学与高温服役性能"
  spectroscopy: "谱学与机理证据"
  production: "连续化与放大生产"

